<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Botão animado do GitHub convertido para HTML, CSS e JavaScript puro."
    >
    <meta name="color-scheme" content="light dark">
    <title>Botão líquido do GitHub</title>
    <link rel="stylesheet" href="css/styles.css?v=2">
    <script src="js/script.js?v=2" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="component-preview" aria-labelledby="page-title">
        <h1 id="page-title" class="visually-hidden">
          Botão animado do GitHub
        </h1>

        <a
          id="github-button"
          class="github-button"
          href="https://github.com/ui-layouts/uilayouts"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Abrir o repositório UI Layouts no GitHub em uma nova aba"
        >
          <span class="button-aura" aria-hidden="true"></span>

          <span class="button-surface" aria-hidden="true">
            <svg
              class="liquid-canvas"
              viewBox="0 0 144 43"
              preserveAspectRatio="none"
              focusable="false"
            >
              <defs>
                <linearGradient
                  id="liquid-base-gradient"
                  x1="-20"
                  y1="48"
                  x2="152"
                  y2="-4"
                  gradientUnits="userSpaceOnUse"
                >
                  <animate
                    attributeName="x1"
                    values="-20;18;-8;-20"
                    dur="9s"
                    repeatCount="indefinite"
                  ></animate>
                  <animate
                    attributeName="x2"
                    values="152;174;136;152"
                    dur="9s"
                    repeatCount="indefinite"
                  ></animate>
                  <stop offset="0" stop-color="#08008f">
                    <animate
                      attributeName="stop-color"
                      values="#08008f;#1503b8;#0b0196;#08008f"
                      dur="9s"
                      repeatCount="indefinite"
                    ></animate>
                  </stop>
                  <stop offset="0.35" stop-color="#23188f">
                    <animate
                      attributeName="stop-color"
                      values="#23188f;#382a9e;#1f168c;#23188f"
                      dur="9s"
                      repeatCount="indefinite"
                    ></animate>
                  </stop>
                  <stop offset="0.72" stop-color="#504b9f">
                    <animate
                      attributeName="stop-color"
                      values="#504b9f;#625da9;#49449b;#504b9f"
                      dur="9s"
                      repeatCount="indefinite"
                    ></animate>
                  </stop>
                  <stop offset="1" stop-color="#8586bf">
                    <animate
                      attributeName="stop-color"
                      values="#8586bf;#9c9ed0;#7d7eb9;#8586bf"
                      dur="9s"
                      repeatCount="indefinite"
                    ></animate>
                  </stop>
                </linearGradient>

                <radialGradient id="liquid-blue">
                  <stop offset="0" stop-color="#1600ff" stop-opacity="0.65"></stop>
                  <stop offset="0.48" stop-color="#1200d9" stop-opacity="0.4"></stop>
                  <stop offset="1" stop-color="#1200d9" stop-opacity="0"></stop>
                </radialGradient>

                <radialGradient id="liquid-depth">
                  <stop offset="0" stop-color="#000085" stop-opacity="1"></stop>
                  <stop offset="0.78" stop-color="#000085" stop-opacity="0.98"></stop>
                  <stop offset="1" stop-color="#000085" stop-opacity="0"></stop>
                </radialGradient>

                <radialGradient id="liquid-violet">
                  <stop offset="0" stop-color="#8a84aa" stop-opacity="0.48"></stop>
                  <stop offset="0.52" stop-color="#6f68a0" stop-opacity="0.18"></stop>
                  <stop offset="1" stop-color="#6f68a0" stop-opacity="0"></stop>
                </radialGradient>

                <radialGradient id="liquid-silver">
                  <stop offset="0" stop-color="#d8dbf4" stop-opacity="0.22"></stop>
                  <stop offset="0.5" stop-color="#c2c6e7" stop-opacity="0.12"></stop>
                  <stop offset="1" stop-color="#c2c6e7" stop-opacity="0"></stop>
                </radialGradient>

                <linearGradient
                  id="surface-glass-gradient"
                  x1="72"
                  y1="0"
                  x2="72"
                  y2="43"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop offset="0" stop-color="#ffffff" stop-opacity="0.02"></stop>
                  <stop offset="0.46" stop-color="#ffffff" stop-opacity="0"></stop>
                  <stop offset="1" stop-color="#05002c" stop-opacity="0.16"></stop>
                </linearGradient>
              </defs>

              <rect
                width="144"
                height="43"
                rx="10"
                fill="url(#liquid-base-gradient)"
              ></rect>

              <ellipse
                cx="-8"
                cy="38"
                rx="62"
                ry="41"
                fill="url(#liquid-blue)"
              >
                <animate
                  attributeName="cx"
                  values="-8;42;12;-8"
                  dur="8s"
                  repeatCount="indefinite"
                ></animate>
                <animate
                  attributeName="cy"
                  values="38;26;48;38"
                  dur="8s"
                  repeatCount="indefinite"
                ></animate>
              </ellipse>

              <ellipse
                cx="55"
                cy="11"
                rx="22"
                ry="25"
                fill="url(#liquid-violet)"
              >
                <animate
                  attributeName="cx"
                  values="55;108;42;55"
                  dur="7.5s"
                  repeatCount="indefinite"
                ></animate>
                <animate
                  attributeName="cy"
                  values="11;26;4;11"
                  dur="7.5s"
                  repeatCount="indefinite"
                ></animate>
              </ellipse>

              <ellipse
                cx="139"
                cy="-2"
                rx="72"
                ry="52"
                fill="url(#liquid-silver)"
              >
                <animate
                  attributeName="cx"
                  values="139;101;151;139"
                  dur="11s"
                  repeatCount="indefinite"
                ></animate>
                <animate
                  attributeName="cy"
                  values="-2;12;3;-2"
                  dur="11s"
                  repeatCount="indefinite"
                ></animate>
              </ellipse>

              <ellipse
                cx="55"
                cy="48"
                rx="38"
                ry="34"
                fill="url(#liquid-depth)"
              >
                <animate
                  attributeName="cx"
                  values="55;35;90;55"
                  dur="10.5s"
                  repeatCount="indefinite"
                ></animate>
                <animate
                  attributeName="cy"
                  values="48;36;46;48"
                  dur="10.5s"
                  repeatCount="indefinite"
                ></animate>
              </ellipse>

              <rect
                width="144"
                height="43"
                rx="10"
                fill="url(#surface-glass-gradient)"
              ></rect>
            </svg>

            <span class="surface-shimmer"></span>
            <span class="surface-glass"></span>
            <span class="surface-rim"></span>
          </span>

          <span class="button-content">
            <svg
              class="button-icon star-icon"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.12 2.12 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.12 2.12 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.769.559l-4.618-2.428a2.12 2.12 0 0 0-1.976 0L6.404 21.01a.53.53 0 0 1-.77-.56l.883-5.139a2.12 2.12 0 0 0-.611-1.879L2.17 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.12 2.12 0 0 0 1.597-1.16z"
              ></path>
            </svg>

            <svg
              class="button-icon github-icon"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.28-.36 6.72-1.61 6.72-7.05A5.5 5.5 0 0 0 19.22 3.6 5.42 5.42 0 0 0 19.13.1S17.95-.26 15 1.6a13.38 13.38 0 0 0-7 0C5.05-.26 3.87.1 3.87.1a5.42 5.42 0 0 0-.09 3.5 5.5 5.5 0 0 0-1.5 3.85c0 5.42 3.44 6.69 6.72 7.05A4.8 4.8 0 0 0 8 18v4"
              ></path>
              <path d="M9 18c-4.51 2-5-2-7-2"></path>
            </svg>

            <span class="button-copy">Github</span>
          </span>
        </a>
      </section>
    </main>
  </body>
</html>
