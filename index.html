<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Dock de aplicativos com ampliação fluida, criado somente com HTML, CSS e JavaScript."
    >
    <meta name="theme-color" content="#080a0f">
    <title>Dock de aplicativos</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
  </head>

  <body>
    <main class="page">
      <section class="dock-demo" aria-labelledby="page-title">
        <h1 id="page-title" class="visually-hidden">Dock de aplicativos</h1>

        <div class="dock-viewport">
          <nav id="dock" class="dock" aria-label="Aplicativos">
            <ul class="dock-list" role="list">
              <li class="dock-item" data-app="Finder">
                <button class="dock-button" type="button" aria-label="Abrir Finder">
                  <span class="dock-tile dock-tile--finder" aria-hidden="true">
                    <svg class="dock-icon" viewBox="0 0 24 24">
                      <path d="M4 4h5l2 3h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"></path>
                    </svg>
                  </span>
                  <span class="dock-tooltip" role="tooltip">Finder</span>
                  <span class="dock-indicator" aria-hidden="true"></span>
                </button>
              </li>

              <li class="dock-item" data-app="Home">
                <button class="dock-button" type="button" aria-label="Abrir Home">
                  <span class="dock-tile dock-tile--home" aria-hidden="true">
                    <svg class="dock-icon" viewBox="0 0 24 24">
                      <path d="m3 11 9-8 9 8"></path>
                      <path d="M5 10v10h14V10"></path>
                      <path d="M9 20v-6h6v6"></path>
                    </svg>
                  </span>
                  <span class="dock-tooltip" role="tooltip">Home</span>
                  <span class="dock-indicator" aria-hidden="true"></span>
                </button>
              </li>

              <li class="dock-item" data-app="Mail">
                <button class="dock-button" type="button" aria-label="Abrir Mail">
                  <span class="dock-tile dock-tile--mail" aria-hidden="true">
                    <svg class="dock-icon" viewBox="0 0 24 24">
                      <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                      <path d="m3 7 9 6 9-6"></path>
                    </svg>
                  </span>
                  <span class="dock-tooltip" role="tooltip">Mail</span>
                  <span class="dock-indicator" aria-hidden="true"></span>
                </button>
              </li>

              <li class="dock-item" data-app="Calendar">
                <button class="dock-button" type="button" aria-label="Abrir Calendar">
                  <span class="dock-tile dock-tile--calendar" aria-hidden="true">
                    <svg class="dock-icon" viewBox="0 0 24 24">
                      <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                      <path d="M16 3v4M8 3v4M3 10h18"></path>
                      <path d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"></path>
                    </svg>
                  </span>
                  <span class="dock-tooltip" role="tooltip">Calendar</span>
                  <span class="dock-indicator" aria-hidden="true"></span>
                </button>
              </li>

              <li class="dock-item" data-app="Camera">
                <button class="dock-button" type="button" aria-label="Abrir Camera">
                  <span class="dock-tile dock-tile--camera" aria-hidden="true">
                    <svg class="dock-icon" viewBox="0 0 24 24">
                      <path d="M14.5 5 13 3h-2L9.5 5H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-4.5Z"></path>
                      <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                  </span>
                  <span class="dock-tooltip" role="tooltip">Camera</span>
                  <span class="dock-indicator" aria-hidden="true"></span>
                </button>
              </li>

              <li class="dock-item" data-app="Music">
                <button class="dock-button" type="button" aria-label="Abrir Music">
                  <span class="dock-tile dock-tile--music" aria-hidden="true">
                    <svg class="dock-icon" viewBox="0 0 24 24">
                      <path d="M9 18V5l11-2v13"></path>
                      <circle cx="6" cy="18" r="3"></circle>
                      <circle cx="17" cy="16" r="3"></circle>
                    </svg>
                  </span>
                  <span class="dock-tooltip" role="tooltip">Music</span>
                  <span class="dock-indicator" aria-hidden="true"></span>
                </button>
              </li>

              <li class="dock-item" data-app="Messages">
                <button class="dock-button" type="button" aria-label="Abrir Messages">
                  <span class="dock-tile dock-tile--messages" aria-hidden="true">
                    <svg class="dock-icon" viewBox="0 0 24 24">
                      <path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9.7 9.7 0 0 1-4-.9L3 21l1.7-4.4A8.5 8.5 0 1 1 21 11.5Z"></path>
                    </svg>
                  </span>
                  <span class="dock-tooltip" role="tooltip">Messages</span>
                  <span class="dock-indicator" aria-hidden="true"></span>
                </button>
              </li>

              <li class="dock-item" data-app="Safari">
                <button class="dock-button" type="button" aria-label="Abrir Safari">
                  <span class="dock-tile dock-tile--safari" aria-hidden="true">
                    <svg class="dock-icon" viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="9"></circle>
                      <path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path>
                    </svg>
                  </span>
                  <span class="dock-tooltip" role="tooltip">Safari</span>
                  <span class="dock-indicator" aria-hidden="true"></span>
                </button>
              </li>

              <li class="dock-item" data-app="Notes">
                <button class="dock-button" type="button" aria-label="Abrir Notes">
                  <span class="dock-tile dock-tile--notes" aria-hidden="true">
                    <svg class="dock-icon" viewBox="0 0 24 24">
                      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path>
                      <path d="M14 2v6h6M8 13h8M8 17h8"></path>
                    </svg>
                  </span>
                  <span class="dock-tooltip" role="tooltip">Notes</span>
                  <span class="dock-indicator" aria-hidden="true"></span>
                </button>
              </li>

              <li class="dock-item" data-app="Settings">
                <button class="dock-button" type="button" aria-label="Abrir Settings">
                  <span class="dock-tile dock-tile--settings" aria-hidden="true">
                    <svg class="dock-icon" viewBox="0 0 24 24">
                      <path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.2a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.8v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.2a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.2a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.8l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.2a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </span>
                  <span class="dock-tooltip" role="tooltip">Settings</span>
                  <span class="dock-indicator" aria-hidden="true"></span>
                </button>
              </li>
            </ul>
          </nav>
        </div>

        <p id="dock-status" class="visually-hidden" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
