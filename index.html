<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Botão animado do GitHub convertido para HTML, CSS e JavaScript puro."
    >
    <meta name="color-scheme" content="light dark">
    <title>Botão líquido do GitHub</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <svg
      class="svg-definitions"
      width="0"
      height="0"
      aria-hidden="true"
      focusable="false"
    >
      <defs>
        <radialGradient
          id="liquid-gradient"
          cx="0"
          cy="0"
          r="1"
          gradientUnits="userSpaceOnUse"
          gradientTransform="translate(287.5 280) rotate(-29.0546) scale(689.807 1000)"
        >
          <stop offset="0" stop-color="#FFFFFF"></stop>
          <stop offset="0.188423" stop-color="#1E10C5"></stop>
          <stop offset="0.260417" stop-color="#9089E2"></stop>
          <stop offset="0.328792" stop-color="#FCFCFE"></stop>
          <stop offset="0.328892" stop-color="#F9F9FD"></stop>
          <stop offset="0.328992" stop-color="#FFFFFF"></stop>
          <stop offset="0.442708" stop-color="#B2B8E7"></stop>
          <stop offset="0.537556" stop-color="#0E2DCB"></stop>
          <stop offset="0.631738" stop-color="#FFFFFF"></stop>
          <stop offset="0.725645" stop-color="#0017E9"></stop>
          <stop offset="0.817779" stop-color="#4743EF"></stop>
          <stop offset="0.84375" stop-color="#7D7BF4"></stop>
          <stop offset="0.90569" stop-color="#FFFFFF"></stop>
          <stop offset="1" stop-color="#0B06FC"></stop>
        </radialGradient>

        <symbol id="liquid-pill" viewBox="0 0 1030 280">
          <rect
            width="1030"
            height="280"
            rx="140"
            fill="url(#liquid-gradient)"
          ></rect>
        </symbol>
      </defs>
    </svg>

    <main class="page-shell">
      <section class="component-preview" aria-labelledby="page-title">
        <h1 id="page-title" class="visually-hidden">
          Botão animado do GitHub
        </h1>

        <a
          id="github-button"
          class="github-button"
          href="https://github.com/ui-layouts/uilayouts"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Abrir o repositório UI Layouts no GitHub em uma nova aba"
        >
          <span class="button-glow" aria-hidden="true">
            <span class="glow-base"></span>
            <span class="liquid">
              <span class="liquid-layer liquid-layer--1">
                <svg viewBox="0 0 1030 280" preserveAspectRatio="none">
                  <use href="#liquid-pill"></use>
                </svg>
              </span>
              <span class="liquid-layer liquid-layer--2">
                <svg viewBox="0 0 1030 280" preserveAspectRatio="none">
                  <use href="#liquid-pill"></use>
                </svg>
              </span>
              <span class="liquid-layer liquid-layer--3">
                <svg viewBox="0 0 1030 280" preserveAspectRatio="none">
                  <use href="#liquid-pill"></use>
                </svg>
              </span>
              <span class="liquid-layer liquid-layer--4">
                <svg viewBox="0 0 1030 280" preserveAspectRatio="none">
                  <use href="#liquid-pill"></use>
                </svg>
              </span>
              <span class="liquid-layer liquid-layer--5">
                <svg viewBox="0 0 1030 280" preserveAspectRatio="none">
                  <use href="#liquid-pill"></use>
                </svg>
              </span>
              <span class="liquid-layer liquid-layer--6">
                <svg viewBox="0 0 1030 280" preserveAspectRatio="none">
                  <use href="#liquid-pill"></use>
                </svg>
              </span>
              <span class="liquid-layer liquid-layer--7">
                <svg viewBox="0 0 1030 280" preserveAspectRatio="none">
                  <use href="#liquid-pill"></use>
                </svg>
              </span>
            </span>
          </span>

          <span class="button-shadow" aria-hidden="true"></span>

          <span class="button-visual" aria-hidden="true">
            <span class="visual-base"></span>
            <span class="visual-ink"></span>
            <span class="liquid">
              <span class="liquid-layer liquid-layer--1">
                <svg viewBox="0 0 1030 280" preserveAspectRatio="none">
                  <use href="#liquid-pill"></use>
                </svg>
              </span>
              <span class="liquid-layer liquid-layer--2">
                <svg viewBox="0 0 1030 280" preserveAspectRatio="none">
                  <use href="#liquid-pill"></use>
                </svg>
              </span>
              <span class="liquid-layer liquid-layer--3">
                <svg viewBox="0 0 1030 280" preserveAspectRatio="none">
                  <use href="#liquid-pill"></use>
                </svg>
              </span>
              <span class="liquid-layer liquid-layer--4">
                <svg viewBox="0 0 1030 280" preserveAspectRatio="none">
                  <use href="#liquid-pill"></use>
                </svg>
              </span>
              <span class="liquid-layer liquid-layer--5">
                <svg viewBox="0 0 1030 280" preserveAspectRatio="none">
                  <use href="#liquid-pill"></use>
                </svg>
              </span>
              <span class="liquid-layer liquid-layer--6">
                <svg viewBox="0 0 1030 280" preserveAspectRatio="none">
                  <use href="#liquid-pill"></use>
                </svg>
              </span>
              <span class="liquid-layer liquid-layer--7">
                <svg viewBox="0 0 1030 280" preserveAspectRatio="none">
                  <use href="#liquid-pill"></use>
                </svg>
              </span>
            </span>
            <span class="border-glow border-glow--soft"></span>
            <span class="border-glow border-glow--soft"></span>
            <span class="border-glow border-glow--wide"></span>
            <span class="border-glow border-glow--medium"></span>
            <span class="border-glow border-glow--medium"></span>
            <span class="center-light"></span>
          </span>

          <span class="button-content">
            <svg
              class="button-icon star-icon"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.12 2.12 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.12 2.12 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.769.559l-4.618-2.428a2.12 2.12 0 0 0-1.976 0L6.404 21.01a.53.53 0 0 1-.77-.56l.883-5.139a2.12 2.12 0 0 0-.611-1.879L2.17 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.12 2.12 0 0 0 1.597-1.16z"
              ></path>
            </svg>

            <svg
              class="button-icon github-icon"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.28-.36 6.72-1.61 6.72-7.05A5.5 5.5 0 0 0 19.22 3.6 5.42 5.42 0 0 0 19.13.1S17.95-.26 15 1.6a13.38 13.38 0 0 0-7 0C5.05-.26 3.87.1 3.87.1a5.42 5.42 0 0 0-.09 3.5 5.5 5.5 0 0 0-1.5 3.85c0 5.42 3.44 6.69 6.72 7.05A4.8 4.8 0 0 0 8 18v4"
              ></path>
              <path d="M9 18c-4.51 2-5-2-7-2"></path>
            </svg>

            <span class="button-copy">Github</span>
          </span>
        </a>
      </section>
    </main>
  </body>
</html>
