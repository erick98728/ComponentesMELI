<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Dock de aplicativos com ampliação fluida, criado somente com HTML, CSS e JavaScript."
    >
    <meta name="theme-color" content="#080a0f">
    <title>Dock de aplicativos</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
  </head>

  <body>
    <main class="page">
      <section class="dock-demo" aria-labelledby="page-title">
        <h1 id="page-title" class="visually-hidden">Dock de aplicativos</h1>

        <div class="dock-viewport">
          <nav id="dock" class="dock" aria-label="Aplicativos">
            <ul class="dock-list" role="list">
              <li class="dock-item" data-app="Início">
                <button class="dock-button" type="button" aria-label="Abrir Início">
                  <span class="dock-tile" aria-hidden="true">
                    <svg class="dock-icon" viewBox="0 0 24 24">
                      <path d="m3 11 9-8 9 8"></path>
                      <path d="M5 10v10h14V10"></path>
                      <path d="M9 20v-6h6v6"></path>
                    </svg>
                  </span>
                  <span class="dock-tooltip" role="tooltip">Início</span>
                  <span class="dock-indicator" aria-hidden="true"></span>
                </button>
              </li>

              <li class="dock-item" data-app="Calendário">
                <button class="dock-button" type="button" aria-label="Abrir Calendário">
                  <span class="dock-tile" aria-hidden="true">
                    <svg class="dock-icon" viewBox="0 0 24 24">
                      <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                      <path d="M16 3v4M8 3v4M3 10h18"></path>
                      <path d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"></path>
                    </svg>
                  </span>
                  <span class="dock-tooltip" role="tooltip">Calendário</span>
                  <span class="dock-indicator" aria-hidden="true"></span>
                </button>
              </li>

              <li class="dock-item" data-app="Mensagens">
                <button class="dock-button" type="button" aria-label="Abrir Mensagens">
                  <span class="dock-tile" aria-hidden="true">
                    <svg class="dock-icon" viewBox="0 0 24 24">
                      <path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9.7 9.7 0 0 1-4-.9L3 21l1.7-4.4A8.5 8.5 0 1 1 21 11.5Z"></path>
                    </svg>
                  </span>
                  <span class="dock-tooltip" role="tooltip">Mensagens</span>
                  <span class="dock-indicator" aria-hidden="true"></span>
                </button>
              </li>

              <li class="dock-item" data-app="Navegador">
                <button class="dock-button" type="button" aria-label="Abrir Navegador">
                  <span class="dock-tile" aria-hidden="true">
                    <svg class="dock-icon" viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="9"></circle>
                      <path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path>
                    </svg>
                  </span>
                  <span class="dock-tooltip" role="tooltip">Navegador</span>
                  <span class="dock-indicator" aria-hidden="true"></span>
                </button>
              </li>

              <li class="dock-item" data-app="Configurações">
                <button class="dock-button" type="button" aria-label="Abrir Configurações">
                  <span class="dock-tile" aria-hidden="true">
                    <svg class="dock-icon" viewBox="0 0 24 24">
                      <path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.2a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.8v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.2a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.2a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.8l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.2a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2Z"></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </span>
                  <span class="dock-tooltip" role="tooltip">Configurações</span>
                  <span class="dock-indicator" aria-hidden="true"></span>
                </button>
              </li>
            </ul>
          </nav>
        </div>

        <p id="dock-status" class="visually-hidden" aria-live="polite"></p>
      </section>
    </main>
  </body>
</html>
